aid: instylla
name: Instylla
description: >-
  Instylla, Inc. is a privately held medical device company headquartered in Bedford, Massachusetts,
  founded in 2017 by Incept LLC to develop next-generation resorbable liquid embolic agents for
  interventional radiology, with initial clinical applications in interventional oncology and
  peripheral hemostasis. Its flagship product, the Embrace Hydrogel Embolic System, received U.S.
  FDA premarket approval (PMA) in August 2025 for the embolization of hypervascular tumors in
  peripheral arteries of 5 mm or less, and began commercial use in January 2026; the company also
  markets the FDA-cleared Tembo Embolic System. Embrace is delivered as two injectable
  polyethylene-glycol precursors that crosslink in the vessel lumen into a soft hydrogel and then
  resorb by hydrolysis over roughly eleven months. Instylla is a device manufacturer rather than a
  software vendor: it publishes no developer program, no public API, and no machine-readable
  interface contract.
